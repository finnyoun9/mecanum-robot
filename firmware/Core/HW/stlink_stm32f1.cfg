# STM32F103C8T6 chassis board via the attached ST-Link V2.
# This board reports SW-DP ID 0x2ba01477; the stock stm32f1x.cfg expects
# 0x1ba01477, so the ID must be overridden before sourcing the target file.
source [find interface/stlink.cfg]
set CPUTAPID 0x2ba01477
source [find target/stm32f1x.cfg]
