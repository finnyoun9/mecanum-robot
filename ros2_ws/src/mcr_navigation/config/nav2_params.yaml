# Nav2 configuration for mecanum robot with omnidirectional motion support.

amcl:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    use_sim_time: false

    # Laser model
    laser_model_type: "likelihood_field"
    laser_max_range: 8.0
    laser_min_range: 0.12
    max_beams: 60
    laser_likelihood_max_dist: 2.0

    # Particle filter
    max_particles: 2000
    min_particles: 500
    update_min_d: 0.05
    update_min_a: 0.1

    # Initial pose
    set_initial_pose: true
    initial_pose: [0.0, 0.0, 0.0]

    # Recovery
    alpha1: 0.2   # Rotation noise from rotation
    alpha2: 0.2   # Rotation noise from translation
    alpha3: 0.2   # Translation noise from translation
    alpha4: 0.2   # Translation noise from rotation
    alpha5: 0.2   # Additional noise

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: "map"
    robot_base_frame: "base_link"
    odom_topic: "/odom"
    bt_xml_filename: ""
    default_nav_to_pose_bt_xml: ""
    transform_tolerance: 0.3

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    # DWB (Dynamic Window Approach) — supports omnidirectional motion
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true

      # Kinematic model — KEY: enable omnidirectional (x, y, yaw)
      max_vel_x: 0.4
      min_vel_x: -0.2
      max_vel_y: 0.25       # Lateral (mecanum feature)
      min_vel_y: -0.25
      max_vel_theta: 1.5
      min_vel_theta: -1.5
      acc_lim_x: 1.5
      acc_lim_y: 1.0        # Lateral acceleration
      acc_lim_theta: 2.5
      decel_lim_x: -2.0
      decel_lim_y: -1.5
      decel_lim_theta: -3.0

      # Goal tolerance
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.05
      transform_tolerance: 0.3

      # DWB plugins
      critics:
        - "RotateToGoal"
        - "Oscillation"
        - "BaseObstacle"
        - "GoalAlign"
        - "PathAlign"
        - "PathDist"
        - "GoalDist"
        - "PreferForward"

      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      Oscillation.scale: 0.01

      # Oscillation prevention for mecanum
      Oscillation.x_only_threshold: 0.02

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    expected_planner_frequency: 1.0

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      downsampler: "Bilinear"
      # SmacPlannerHybrid params:
      angle_quantization_bins: 72    # 5° resolution
      analytic_expansion_ratio: 3.0
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.0   # 0 = mecanum can turn in place
      allow_primitive_interpolation: true
      motion_model_for_search: "REEDS_SHEPP"  # Omnidirectional
      cache_obstacle_heuristic: true
      reverse_penalty: 2.1
      change_penalty: 0.5
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.05

global_costmap:
  ros__parameters:
    use_sim_time: false
    update_frequency: 1.0
    publish_frequency: 0.5
    global_frame: "map"
    robot_base_frame: "base_link"
    robot_radius: 0.19   # Half diagonal of robot
    resolution: 0.05
    track_unknown_space: true
    always_send_full_costmap: true
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: true

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      observation_sources: "laser_scan"
      laser_scan:
        topic: "/scan"
        max_obstacle_height: 0.3
        clearing: true
        marking: true
        obstacle_max_range: 6.0
        obstacle_min_range: 0.12
        data_type: "LaserScan"

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.25
      cost_scaling_factor: 5.0

local_costmap:
  ros__parameters:
    use_sim_time: false
    update_frequency: 5.0
    publish_frequency: 2.0
    global_frame: "odom"
    robot_base_frame: "base_link"
    robot_radius: 0.19
    resolution: 0.05
    width: 4
    height: 4
    rolling_window: true
    plugins: ["obstacle_layer", "inflation_layer"]

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      observation_sources: "laser_scan"
      laser_scan:
        topic: "/scan"
        max_obstacle_height: 0.3
        clearing: true
        marking: true
        obstacle_max_range: 4.0
        obstacle_min_range: 0.12
        data_type: "LaserScan"

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.25
      cost_scaling_factor: 5.0

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: "local_costmap/costmap_raw"
    global_costmap_topic: "global_costmap/costmap_raw"
    local_footprint_topic: "local_costmap/published_footprint"
    global_footprint_topic: "global_costmap/published_footprint"
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200
