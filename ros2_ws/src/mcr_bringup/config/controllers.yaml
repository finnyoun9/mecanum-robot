# Controller configuration for mecanum robot.
#
# Uses mecanum_drive_controller which:
#   1. Subscribes to /cmd_vel
#   2. Computes mecanum inverse kinematics
#   3. Sends 4 individual wheel velocity commands to the hardware interface

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

# --- Mecanum Drive Controller ---
mecanum_drive_controller:
  ros__parameters:
    # Wheel names — must match URDF joint names
    front_left_wheel:  "wheel_front_left_joint"
    front_right_wheel: "wheel_front_right_joint"
    rear_left_wheel:   "wheel_rear_left_joint"
    rear_right_wheel:  "wheel_rear_right_joint"

    # Kinematics (must match URDF and mecanum_params in hardware interface)
    wheel_radius: 0.0325   # metres (65mm diameter / 2)
    wheel_base:   0.20     # lx * 2 (front-rear distance)
    track_width:  0.24     # ly * 2 (left-right distance)

    # Limits
    linear.x.max_velocity:  0.5   # m/s
    linear.y.max_velocity:  0.3   # m/s (lateral)
    angular.z.max_velocity: 1.5   # rad/s

    # Base frame
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"

    # Publish rate
    publish_rate: 50.0

    # Velocity rolling window for acceleration limiting
    velocity_rolling_window_size: 10

# --- Joint State Broadcaster ---
joint_state_broadcaster:
  ros__parameters:
    joints:
      - wheel_front_left_joint
      - wheel_front_right_joint
      - wheel_rear_left_joint
      - wheel_rear_right_joint
    extra_joints:
      - imu_joint
    publish_rate: 50.0

# --- IMU Sensor Broadcaster ---
imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor"
    frame_id: "imu_link"
    publish_rate: 100.0
