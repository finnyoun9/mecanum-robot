# Controller configuration for mecanum robot.
#
# Uses the official ros-controls/ros2_controllers `mecanum_drive_controller`
# (verified against the Jazzy docs: https://control.ros.org/jazzy/doc/ros2_controllers/mecanum_drive_controller/doc/userdoc.html
# and the package's generate_parameter_library schema — param names below are
# the REAL ones, not guessed).
#
#   1. Subscribes to /cmd_vel
#   2. Computes mecanum inverse kinematics
#   3. Sends 4 individual wheel velocity commands to the hardware interface
#   4. Publishes odometry on /mecanum_drive_controller/odom (consumed by the
#      robot_localization EKF in ekf.yaml, NOT used directly for the
#      odom->base_footprint TF — see enable_odom_tf below)

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

# --- Mecanum Drive Controller ---
mecanum_drive_controller:
  ros__parameters:
    reference_timeout: 0.5  # seconds — cmd_vel considered stale after this

    # Command/state joint names — must match URDF joint names AND the
    # joints exported by MCRHardwareInterface (mcr_hardware_interface.cpp)
    front_left_wheel_command_joint_name:  "wheel_front_left_joint"
    front_right_wheel_command_joint_name: "wheel_front_right_joint"
    rear_left_wheel_command_joint_name:   "wheel_rear_left_joint"
    rear_right_wheel_command_joint_name:  "wheel_rear_right_joint"

    front_left_wheel_state_joint_name:  "wheel_front_left_joint"
    front_right_wheel_state_joint_name: "wheel_front_right_joint"
    rear_left_wheel_state_joint_name:   "wheel_rear_left_joint"
    rear_right_wheel_state_joint_name:  "wheel_rear_right_joint"

    # Kinematics — must match mcr.urdf.xacro (wheel_radius, lx, ly) and
    # mecanum_kinematics.hpp (MecanumParams)
    kinematics:
      base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
      wheels_radius: 0.030                             # m (60mm measured diameter / 2)
      sum_of_robot_center_projection_on_X_Y_axis: 0.22  # lx + ly = 0.10 + 0.12

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"

    # The robot_localization EKF (ekf.yaml) is the sole publisher of the
    # odom->base_footprint TF, fusing this controller's wheel odometry with
    # IMU yaw. Publishing it here too would create two competing TF
    # broadcasters on the same edge.
    enable_odom_tf: false

    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # Velocity limits
    linear:
      x:
        max_velocity: 0.5    # m/s forward
        min_velocity: -0.3   # m/s reverse
      y:
        max_velocity: 0.3    # m/s lateral (mecanum feature)
        min_velocity: -0.3
    angular:
      z:
        max_velocity: 1.5    # rad/s
        min_velocity: -1.5

# --- Joint State Broadcaster ---
joint_state_broadcaster:
  ros__parameters:
    joints:
      - wheel_front_left_joint
      - wheel_front_right_joint
      - wheel_rear_left_joint
      - wheel_rear_right_joint
    extra_joints:
      - imu_joint

# --- IMU Sensor Broadcaster ---
imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor"
    frame_id: "imu_link"
