name: Firmware Tests

on:
  push:
    branches: [ main, develop, '**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Run calibration constant guard
      run: bash tools/check_calibration_constants.sh

    - name: Run STM32 UART sim wheel-model tests
      run: python3 tools/test_stm32_uart_sim.py

    - name: Run protocol tests
      run: |
        gcc -std=c11 -I shared shared/tests/test_protocol.c shared/protocol.c -o /tmp/test_protocol
        /tmp/test_protocol

    - name: Run PID controller tests
      run: |
        gcc -std=c11 -I firmware/Core/Inc firmware/Core/Test/test_pid.c firmware/Core/Src/pid.c -lm -o /tmp/test_pid
        /tmp/test_pid

    - name: Run AHRS filter tests
      run: |
        gcc -std=c99 -Wall -Wextra -I firmware/Core/Inc firmware/Core/Test/test_ahrs.c firmware/Core/Src/ahrs.c -lm -o /tmp/test_ahrs
        /tmp/test_ahrs

    - name: Run mecanum IK tests
      run: |
        gcc -std=c11 -Wall -Wextra -I firmware/Core/Inc firmware/Core/Test/test_mecanum_ik.c firmware/Core/Src/mecanum_ik.c -lm -o /tmp/test_mecanum_ik
        /tmp/test_mecanum_ik

    - name: Run remote control tests
      run: |
        gcc -std=c11 -Wall -Wextra -I firmware/Core/Inc firmware/Core/Test/test_remote_control.c firmware/Core/Src/remote_control.c firmware/Core/Src/mecanum_ik.c -lm -o /tmp/test_remote_control
        /tmp/test_remote_control

    - name: Run encoder tests
      run: |
        gcc -std=c11 -Wall -Wextra -I firmware/Core/Inc firmware/Core/Test/test_encoder.c firmware/Core/Src/encoder.c -lm -o /tmp/test_encoder
        /tmp/test_encoder

    - name: Run stall protection tests
      run: |
        gcc -std=c11 -Wall -Wextra -I firmware/Core/Inc -I shared firmware/Core/Test/test_stall.c firmware/Core/Src/robot_control.c firmware/Core/Src/pid.c shared/protocol.c -lm -o /tmp/test_stall
        /tmp/test_stall

    - name: Run MPU6050 driver tests
      run: |
        gcc -std=c11 -Wall -Wextra -I firmware/Core/Inc -I firmware/Core/SIL/mocks firmware/Core/Test/test_mpu6050.c firmware/Core/Src/mpu6050.c -lm -o /tmp/test_mpu6050
        /tmp/test_mpu6050

    - name: SIL firmware build + test
      run: |
        mkdir -p firmware/Core/build
        cd firmware/Core/build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)
        ./sil_firmware --ci

    - name: Arm controller SIL build + test
      run: |
        mkdir -p firmware/arm_controller/build
        cd firmware/arm_controller/build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)
        ./sil_arm_controller --ci
